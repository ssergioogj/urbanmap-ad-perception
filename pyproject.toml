[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UrbanMap"
version = "0.1.0"
description = "LSS implementation for autonomous driving"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0",
    "nuscenes-devkit>=1.1.11",
    "pyquaternion>=0.9.9",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "timm>=1.0.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["nuscenes", "data_loader", "lss"]
