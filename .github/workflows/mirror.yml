name: Mirror to Secondary Repository

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    if: github.repository != 'ssergioogj/urbanmap-ad-perception'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DESTINATION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts

      - name: Push mirror to destination
        run: |
          git push --mirror --prune git@github.com:ssergioogj/urbanmap-ad-perception.git
